[package]
name = "oxs-py"
version = "0.3.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oxarchive_backtest"
crate-type = ["cdylib"]

[dependencies]
oxs-engine = { path = "../engine" }
oxs-math = { path = "../math" }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
oxs-schema = { path = "../schema" }
oxs-dataset = { path = "../dataset" }
oxs-build-api = { path = "../build-api" }
serde_json = "1.0.151"
