[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "0xarchive-backtest"
version = "0.3.1"
description = "Deterministic backtesting for Hyperliquid perps on 0xArchive data: a Rust engine, Python strategies, and a gauntlet that says whether an edge is real"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "0xArchive" }]
keywords = ["backtesting", "quant", "trading", "hyperliquid", "crypto", "perpetuals", "rust", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://www.0xarchive.io"
Source = "https://github.com/0xArchiveIO/0xarchive-quant"
Documentation = "https://github.com/0xArchiveIO/0xarchive-quant/blob/main/skills/backtest/references/strategy-api.md"
Issues = "https://github.com/0xArchiveIO/0xarchive-quant/issues"

[project.optional-dependencies]
# The curated package set at pinned versions; must match
# python/oxarchive_backtest/packages.py (tests/test_cli.py checks).
curated = [
    "numpy==2.4.6",
    "pandas==3.0.2",
    "scipy==1.18.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "six==1.17.0",
]

[project.scripts]
0xbt = "oxarchive_backtest.cli:main"

[tool.maturin]
module-name = "oxarchive_backtest._native"
python-source = "python"
